name: release

# Publica Orbit: instaladores para macOS (Apple Silicon e Intel) y Windows en GitHub Releases, sin
# firmar con certificados de pago. Se dispara al subir una etiqueta `vX.Y.Z`; a mano ("Run workflow")
# solo compila y guarda los instaladores como artefactos, sin publicar nada.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: la etiqueta coincide con la versión de la app
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de tauri.conf.json" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Sin etiqueta (ejecución a mano) solo compila.
          tagName: ${{ env.PUBLISH == 'true' && github.ref_name || '' }}
          releaseName: ${{ env.PUBLISH == 'true' && format('Orbit {0}', github.ref_name) || '' }}
          releaseBody: |
            Instaladores de Orbit sin firmar con certificados de pago: macOS y Windows avisan antes de
            abrirlos la primera vez. Las instrucciones están en el README.
            Orbit installers are not signed with paid certificates: macOS and Windows warn before the
            first launch. See the README.
          # Se queda como "pre-lanzamiento" hasta que `publish` comprueba que todo se subió.
          prerelease: true
          args: --target ${{ matrix.target }}

      - name: zip portátil (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/orbit.exe" portable/Orbit.exe
          $zip = "Orbit_${version}_x64-portable.zip"
          Compress-Archive -Path portable/Orbit.exe -DestinationPath $zip
          if ($env:PUBLISH -eq 'true') {
            gh release upload "$env:GITHUB_REF_NAME" $zip --clobber
          }

      - name: guardar los instaladores (ejecución a mano)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: orbit-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            Orbit_*_x64-portable.zip
          if-no-files-found: error

  publish:
    name: publicar la versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: huellas SHA-256 de todo lo publicado
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --dir assets --repo "$GITHUB_REPOSITORY" --clobber
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

      - name: manifiestos de Homebrew y Scoop
        run: |
          python3 -m unittest discover -s scripts
          python3 scripts/update_manifests.py --version "${GITHUB_REF_NAME#v}" --sums SHA256SUMS.txt

      - name: guardar los manifiestos en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/orbit.rb bucket/orbit.json
          if git diff --cached --quiet; then
            echo "los manifiestos ya estaban al día"
          else
            git commit -m "chore(release): update Homebrew and Scoop manifests for $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi

      - name: publicar
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
