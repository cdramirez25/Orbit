[package]
name = "orbit"
version = "0.1.0"
description = "Orbit — isla dinámica modular para macOS y Windows"
authors = ["Orbit"]
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `macos-private-api` es necesario para ventanas transparentes en macOS (debe coincidir
# con `app.macOSPrivateApi` en tauri.conf.json). Implica no publicar en la Mac App Store.
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Cliente HTTP bloqueante para el clima (solo Rust habla con Internet). Usa el TLS del sistema
# operativo (Secure Transport / SChannel) con sus certificados. La característica `native-tls` de
# ureq trae `webpki-root-certs` (CDLA-Permissive-2.0: datos de certificados, licencia permisiva).
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] } # MIT OR Apache-2.0
# Historial del portapapeles (solo en memoria): leer/escribir texto e imágenes, y codificar
# miniaturas. Todas MIT OR Apache-2.0.
arboard = "3"
png = "0.18"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Transcripción local (Fase 3b): whisper.cpp enlazado dentro de la app. La crate es Unlicense
# (dominio público); whisper.cpp y los modelos de OpenAI son MIT. Compilarla necesita cmake.
whisper-rs = "0.16"
# Base de datos local (SQLite) para las claves y la configuración de la IA. El SQLite viene incluido
# (`bundled`), así que no depende de nada del sistema. MIT; SQLite es de dominio público.
rusqlite = { version = "0.40", features = ["bundled"] }
# Atajos globales del teclado (grabar la pregunta, mostrar u ocultar la isla). MIT OR Apache-2.0.
tauri-plugin-global-shortcut = "2"
# Verifica que el modelo de Whisper descargado es el esperado. MIT OR Apache-2.0.
sha2 = "0.11"
# Abrir Orbit al iniciar sesión (LaunchAgent en macOS, registro de inicio en Windows). MIT OR Apache-2.0.
tauri-plugin-autostart = "2"
# Mantener la pantalla encendida (IOKit en macOS, SetThreadExecutionState en Windows). MIT.
keepawake = "0.6"
# Hora local para los horarios de pantalla encendida. MIT OR Apache-2.0.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Selector nativo de carpeta para elegir dónde se guarda el modelo de voz. MIT OR Apache-2.0.
tauri-plugin-dialog = "2"
# Uso de CPU, memoria y tráfico de red del equipo (módulo Equipo). MIT.
sysinfo = { version = "0.38", default-features = false, features = ["system", "network"] }

# Solo macOS: ventana convertida en NSPanel + detección del notch (window/platform/macos.rs) y
# captura del audio del sistema con ScreenCaptureKit (audio/platform/macos_sck.rs). Whisper usa
# la GPU con Metal.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
tauri-nspanel = "2.1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
screencapturekit = "11" # MIT OR Apache-2.0
# Lista de ventanas abiertas (fondo de pantalla en modo rendimiento). MIT OR Apache-2.0.
core-graphics = "0.25"
core-foundation = "0.10" # MIT OR Apache-2.0

# Solo Windows: captura del audio de salida (WASAPI loopback) en audio/platform/windows_wasapi.rs y
# detector de cambios del portapapeles en clipboard/platform/windows.rs y música (GSMTC) en
# media/platform/windows.rs.
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.26" # MIT
# La macro `#[interface]` (IPolicyConfig, salida de sonido) genera código que nombra esta crate. MIT OR Apache-2.0.
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_System_DataExchange", "Win32_System_WinRT", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] } # MIT OR Apache-2.0

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
